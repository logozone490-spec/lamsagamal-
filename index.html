<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لمسة جمال - نشر المنتجات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f2f2f2;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            min-height: 100vh;
        }

        /* الهيدر العلوي */
        .navbar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 5px;
        }
        .cart-btn {
            background: #e0e0e0;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 18px;
            cursor: pointer;
        }
        .logo-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #b8860b;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #5c1d24;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .store-btn {
            background-color: #5c1d24;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        /* كارت النموذج الرئيسي */
        .card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background-color: #f9f9f9;
            font-size: 15px;
            outline: none;
            text-align: right;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #5c1d24;
            background-color: #fff;
        }
        .row-inputs {
            display: flex;
            gap: 10px;
        }
        .row-inputs > div {
            flex: 1;
        }

        /* مربع رفع ومعاينة الصورة */
        .image-upload-box {
            border: 2px dashed #ccc;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            background-color: #fafafa;
            cursor: pointer;
            position: relative;
            margin-bottom: 10px;
        }
        .image-upload-box input[type="file"] {
            display: none;
        }
        .image-preview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 10px;
            display: none;
            margin: 0 auto;
        }
